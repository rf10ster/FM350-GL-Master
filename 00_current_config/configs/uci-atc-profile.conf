# Reference UCI profile: ATC primary
# RU: Порт /dev/ttyUSB3 примерный. Перед применением проверьте актуальный ttyUSB.
# EN: /dev/ttyUSB3 is an example. Validate active ttyUSB before applying.

config interface 'wan_fm350_atc'
	option proto 'atc'
	option device '/dev/ttyUSB3'
	option apn 'internet.beeline.ru'
	option pdptype 'IP'
